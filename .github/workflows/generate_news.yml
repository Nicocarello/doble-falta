name: Resumen Diario de Tenistas Argentinos

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (05:00 AM hora de Argentina)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente en 1 clic desde GitHub
    inputs:
      target_date:
        description: 'Fecha a procesar (YYYY-MM-DD, dejar vacío para ayer)'
        required: false
        default: ''

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar generador de noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: node scripts/generate_news.js

