<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <!-- Glow filter for tennis ball -->
    <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Green gradient for swoosh -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DBFF00;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#DBFF00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.4"/>
    </linearGradient>
    <!-- Ball gradient - tennis ball yellow-green -->
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#e8ff60"/>
      <stop offset="60%" style="stop-color:#DBFF00"/>
      <stop offset="100%" style="stop-color:#a0b800"/>
    </radialGradient>
    <!-- Ball glow radial -->
    <radialGradient id="ballGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DBFF00;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#DBFF00;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Ball outer glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#ballGlow2)"/>

  <!-- Tennis ball body -->
  <circle cx="32" cy="32" r="20" fill="url(#ballGrad)" filter="url(#ballGlow)"/>

  <!-- Tennis ball seam lines (white curves) -->
  <path d="M 18 24 Q 32 32 18 40" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 46 24 Q 32 32 46 40" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- DOBLE text -->
  <text
    x="66"
    y="30"
    font-family="'Impact', 'Arial Black', 'Bebas Neue', sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="3"
    fill="#FFFFFF"
    filter="url(#textGlow)"
  >DOBLE</text>

  <!-- FALTA text in neon yellow -->
  <text
    x="66"
    y="55"
    font-family="'Impact', 'Arial Black', 'Bebas Neue', sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="3"
    fill="#DBFF00"
    filter="url(#textGlow)"
  >FALTA</text>

  <!-- Swoosh accent line under FALTA -->
  <path d="M 66 60 Q 140 57 230 61" fill="none" stroke="url(#swooshGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Separator dot between DOBLE/FALTA -->
  <circle cx="58" cy="42" r="2" fill="#DBFF00" opacity="0.6"/>
</svg>
